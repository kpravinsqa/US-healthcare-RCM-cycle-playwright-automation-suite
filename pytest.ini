[pytest]
testpaths = tests
pythonpath = .
addopts =
    -v
    --strict-markers
    --screenshot=only-on-failure
    --output=reports/artifacts
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: critical-path checks run on every commit
    regression: full functional regression
    api: REST API level tests (no browser)
    ui: browser-driven end-to-end tests
    negative: negative / validation scenarios
    defect: regression guard for a previously reported production defect
log_cli = false
